<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Body Presence Image Carousel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    
    <img id="mainImage" src="/static/images/0.jpg" alt="Image">
    <div id="imageCounter">Image 1 of 10</div>
    <img id="videoFeed" src="/video_feed" alt="Video Feed">
    
    <div id="instructions">
        <h3>Instructions</h3>
        <p>📹 Step inside the green rectangle</p>
        <p>▶️ Frames will play forward automatically (0→9, then loop)</p>
        <p>🚶 Step outside the rectangle</p>
        <p>◀️ Frames will rewind to frame 0 and stop</p>
    </div>
    
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
